<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone vs. AAPL: Buy the phone or buy the stock?</title>
    <meta
      name="description"
      content="What every iPhone's launch price would be worth today if it had gone into Apple (AAPL) stock on launch day instead. Interactive charts, a calculator and your own iPhone history."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iPhone vs. AAPL: Buy the phone or buy the stock?" />
    <meta
      property="og:description"
      content="What every iPhone's launch price would be worth today in Apple stock. Interactive charts, a calculator and your own iPhone history."
    />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so the page never flashes.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        This site needs JavaScript for its charts and calculator. The full data table is in the
        repository README.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
