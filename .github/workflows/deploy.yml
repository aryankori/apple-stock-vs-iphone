name: Deploy site

on:
  push:
    branches: [main, redesign]
  workflow_dispatch:
  schedule:
    # Refresh the AAPL price every hour during US trading hours on weekdays,
    # and once more after the close. Scheduled runs only fire on the default branch.
    - cron: '35 14-20 * * 1-5'
    - cron: '50 21 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Falls back to the committed snapshot if Yahoo Finance is unavailable.
      - name: Fetch latest AAPL prices
        run: npm run fetch-data

      - name: Unit tests
        if: github.event_name != 'schedule'
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
